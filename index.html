<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1b1714" />
    <title>Rustfront</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      #game canvas { display: block; }
      /* Room code input. The lobby scene positions it over the canvas. */
      #join-code { position: fixed; box-sizing: border-box; margin: 0; padding: 0 8px; font: 22px monospace; letter-spacing: 0.3em; text-align: center; text-transform: uppercase; color: #e8d9b5; background: #2a221d; border: 2px solid #8a7f6e; border-radius: 6px; outline: none; }
      #join-code:focus { border-color: #e8d9b5; }
      #join-code[hidden] { display: none; }
      #join-code::placeholder { color: #6b6255; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <input id="join-code" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" placeholder="CODE" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
